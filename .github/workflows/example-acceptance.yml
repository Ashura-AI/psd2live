name: Example acceptance

# Large-asset checks are opt-in; ordinary PR CI does not download examples.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PSD2LIVE_TOOLS: '1'
      PSD2LIVE_GOLDEN_LABEL: acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up JDK 21 (JetBrains Runtime)
        uses: ./.github/actions/setup-jbr
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-example-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-example-gradle-
      - name: Cache pinned assets
        uses: actions/cache@v4
        with:
          path: build/example-assets
          key: example-assets-${{ hashFiles('tools/examples/fixtures.lock.json') }}
      - name: Verify download tooling
        run: python -m unittest discover -s tools/examples -p 'test_*.py'
      - name: Fetch and verify selected cases
        run: python tools/examples/fetch.py --case tml --case ds
      - name: Generate export and CMO3 import reports
        run: ./gradlew test --tests 'io.github.psd2live.tools.ExportGoldenTool' --no-daemon --rerun
      - name: Require complete reports
        run: python tools/examples/check_report.py
      - name: Upload reports and exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-acceptance
          path: |
            build/tools/export-golden/
            build/reports/tests/
          if-no-files-found: warn
